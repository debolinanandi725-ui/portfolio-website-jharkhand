<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Festivals & Events - Jharkhand</title>
  <link rel="stylesheet" href="cmap.css" />
</head>
<body>

  <section class="festival-section">
    <div class="festival-container" id="festivalList">
      <!-- Festival cards will load here -->
    </div>
  </section>

  <!-- Festival Info Modal -->
  <div id="festivalModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2 id="modalTitle"></h2>
      <ul id="modalDetails">
        <!-- Details will be populated via JavaScript -->
      </ul>
    </div>
  </div>

  <script src="cmap.js"></script>
</body>
</html>
